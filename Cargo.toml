[package]
name = "systemoverview"
version = "27.0.0"
edition = "2021"
description = "About window for TontooOS showing device overview"
readme = "README.md"

[[bin]]
name = "systemoverview"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["TontooUI", "Accessibility", "CoreSettings"] }
