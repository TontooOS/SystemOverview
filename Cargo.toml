[package]
name = "systemoverview"
version = "26.1.0"
edition = "2021"
description = "About window for TontooOS showing device overview"
readme = "README.md"

[[bin]]
name = "systemoverview"
path = "src/main.rs"

[dependencies]
# TontooOS SDK: frameworks via features (on-device: /Library/System/sdk).
sdk = { path = "../../TontooLibs/SDK", features = ["UIKit", "CoreSettings"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
